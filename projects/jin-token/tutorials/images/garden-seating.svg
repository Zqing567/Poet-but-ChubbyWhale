<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" role="img"><rect width="900" height="550" rx="16" fill="#f8f4ea"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#153b4d"><text x="28" y="38" font-size="25" >曲水如何串联人物</text><text x="28" y="67" font-size="16" >依据最终场景整理的关系示意 · 非历史手绘原件</text><rect x="570" y="90" width="305" height="390" rx="12" fill="#ebe6db" stroke="#c5bfb0" stroke-dasharray="6 5"/><text x="610" y="235" font-size="22" >七句诗的留白区</text><text x="625" y="270" font-size="18" >不放主要人物</text><path d="M475 100 C555 170 330 160 465 245 S415 345 315 475" stroke="#c9dfe5" stroke-width="44" fill="none"/><path d="M475 100 C555 170 330 160 465 245 S415 345 315 475" stroke="#668d9c" stroke-width="2" fill="none"/><circle cx="397" cy="120" r="14" fill="#e4b45d" stroke="#5c6c70"/><text x="352" y="96" font-size="18" >Grok · 远</text><circle cx="505" cy="235" r="14" fill="#e4b45d" stroke="#5c6c70"/><text x="460" y="211" font-size="18" >Gemini</text><circle cx="275" cy="220" r="14" fill="#e4b45d" stroke="#5c6c70"/><text x="230" y="196" font-size="18" >Qwen</text><circle cx="245" cy="350" r="14" fill="#e4b45d" stroke="#5c6c70"/><text x="200" y="326" font-size="18" >大肥鱼 · 主人</text><circle cx="110" cy="435" r="14" fill="#e4b45d" stroke="#5c6c70"/><text x="65" y="411" font-size="18" >Claude · 近</text><circle cx="460" cy="420" r="14" fill="#e4b45d" stroke="#5c6c70"/><text x="415" y="396" font-size="18" >GPT · 近</text><text x="28" y="520" font-size="17" >水道有双岸与远近变化；点位只说明主宾关系，不代表精确坐标。</text></g></svg>
