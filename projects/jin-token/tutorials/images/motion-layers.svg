<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img"><rect width="900" height="480" rx="16" fill="#f8f4ea"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#153b4d"><text x="28" y="40" font-size="25" >片尾继续播放的是这些层</text><text x="28" y="70" font-size="16" >源码结构示意 · 色块不是成片截图</text><rect x="30" y="96" width="840" height="50" rx="8" fill="#e5e0d5"/><text x="50" y="129" font-size="20" >静态主画</text><text x="235" y="129" font-size="19" >曲水与人物保持</text><rect x="30" y="160" width="840" height="50" rx="8" fill="#d7e5e5"/><text x="50" y="193" font-size="20" >完整字幕</text><text x="235" y="193" font-size="19" >七句读过后继续保留</text><rect x="30" y="224" width="840" height="50" rx="8" fill="#eae2cd"/><text x="50" y="257" font-size="20" >纸云底图</text><text x="235" y="257" font-size="19" >金币盆与装饰保持</text><rect x="30" y="288" width="840" height="50" rx="8" fill="#cbdce9"/><text x="50" y="321" font-size="20" >透明动作</text><text x="235" y="321" font-size="19" >A48按151帧周期继续循环</text><rect x="30" y="352" width="840" height="50" rx="8" fill="#e2d5dc"/><text x="50" y="385" font-size="20" >最终混音</text><text x="235" y="385" font-size="19" >持续播放，尾部淡出</text><text x="30" y="452" font-size="18" >总时间线与动态层都延长90帧；只复制最后一帧不会继续动作。</text></g></svg>
