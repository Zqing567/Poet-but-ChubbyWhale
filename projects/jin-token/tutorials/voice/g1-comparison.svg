<svg xmlns="http://www.w3.org/2000/svg" width="760" height="258" viewBox="0 0 760 258" role="img" aria-labelledby="title desc">
  <title id="title">两次君不见的A/B试听记录</title>
  <desc id="desc">G1 A自然连续生成10.89秒。G1 B加入SSML停顿并修整过长静默14.49秒，作者选择B。这是时长与流程示意，不是录音波形。</desc>
  <rect width="760" height="258" rx="14" fill="#f6f3eb"/>
  <g font-family="sans-serif" fill="#234a58">
    <text x="28" y="38" font-size="23" font-weight="bold">同样两句诗，停连方式不同</text>
    <text x="28" y="78" font-size="18">G1_A　自然连续生成</text>
    <rect x="28" y="94" width="327" height="25" rx="5" fill="#91acb5"/>
    <text x="371" y="114" font-size="20">10.89 秒</text>
    <text x="28" y="154" font-size="18">G1_B　加入停顿，再修整过长静默</text>
    <rect x="28" y="170" width="435" height="25" rx="5" fill="#456f7e"/>
    <text x="480" y="190" font-size="20">14.49 秒 · 作者选用</text>
    <text x="28" y="232" font-size="15">来源：三组试听阶段的 G1_A / G1_B。条形表示时长，不是波形；更长不等于更好。</text>
  </g>
</svg>
